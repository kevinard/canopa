# Alternative to config.toml. Requires Weston 15+ with kiosk-shell and program-exit support.
# Merge into /etc/greetd/config.toml; do not run alongside another display manager.
[terminal]
vt = 1

[default_session]
command = "dbus-run-session /usr/local/bin/canopa-greeter session --compositor weston"
user = "greeter"
