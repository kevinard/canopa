# Example only. Merge deliberately into /etc/greetd/config.toml after installing
# root-owned binaries/assets and creating the unprivileged greeter account.
# Niri is the default login compositor; config-cage.toml and config-weston.toml
# are the alternatives.
[terminal]
vt = 1

[default_session]
command = "dbus-run-session /usr/local/bin/canopa-greeter session --compositor niri"
user = "greeter"
