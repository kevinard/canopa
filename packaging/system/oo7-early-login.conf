[Unit]
# logind waits for the user manager, which signals readiness at basic.target.
DefaultDependencies=no
Before=basic.target shutdown.target
Conflicts=shutdown.target

[Service]
Type=dbus
BusName=org.freedesktop.secrets
# oo7 acquires its bus name before opening the PAM listener.
ExecStartPost=/usr/lib/canopa/oo7-wait-for-pam %t ${MAINPID}
TimeoutStartSec=5s
