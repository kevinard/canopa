[package]
autotests = false
name = "canopa-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:iced", "dep:canopa-ui"]

[dependencies]
canopa-apps.workspace = true
canopa-launcher.workspace = true
canopa-notify-client.workspace = true
canopa-services = { workspace = true, features = ["audio"] }
anyhow.workspace = true
canopa-config.workspace = true
canopa-file.workspace = true
canopa-theme.workspace = true
canopa-session-ui.workspace = true
canopa-ui = { workspace = true, optional = true }
clap.workspace = true
futures-util.workspace = true
iced = { workspace = true, optional = true, features = ["tokio", "tiny-skia"] }
kdl = { workspace = true, features = ["v1"] }
libc.workspace = true
niri-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net"] }
wayland-client.workspace = true
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
xkbcommon = "0.8"
zbus.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
canopa-services = { workspace = true, features = ["audio", "test-support"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
