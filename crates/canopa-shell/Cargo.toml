[package]
autotests = false
name = "canopa-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[features]
default = ["desktop"]
desktop = [
    "dep:canopa-apps",
    "dep:canopa-launcher",
    "dep:gio",
    "dep:canopa-assets",
    "dep:canopa-file",
    "dep:canopa-notify-client",
    "dep:canopa-config",
    "dep:canopa-theme",
    "dep:canopa-ui",
    "dep:accesskit",
    "dep:accesskit_unix",
    "dep:image",
    "dep:rustix",
    "dep:resvg",
    "dep:iced_layershell",
    "dep:iced",
    "dep:kdl",
    "dep:miette",
    "dep:chrono",
    "dep:niri-ipc",
    "dep:unicode-segmentation",
    "dep:sha2",
    "dep:tempfile",
]

[[bin]]
name = "canopa-shell"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
canopa-apps = { workspace = true, optional = true }
canopa-launcher = { workspace = true, optional = true }
gio = { workspace = true, optional = true }
canopa-widgets.workspace = true
futures-util.workspace = true
canopa-assets = { workspace = true, optional = true }
canopa-file = { workspace = true, optional = true }
canopa-notify-client = { workspace = true, optional = true }
canopa-config = { workspace = true, optional = true }
canopa-theme = { workspace = true, optional = true }
canopa-ui = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
accesskit_unix = { workspace = true, optional = true }
canopa-panel-protocol = { workspace = true, features = ["tokio"] }
image = { workspace = true, optional = true, features = ["gif", "webp"] }
rustix = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
iced_layershell = { workspace = true, optional = true, features = ["linux-theme-detection"] }
iced = { workspace = true, optional = true, features = ["svg", "canvas", "tokio", "tiny-skia"] }
zbus.workspace = true
kdl = { workspace = true, optional = true }
miette = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true
chrono = { workspace = true, optional = true }
niri-ipc = { workspace = true, optional = true }
libpulse-binding.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
