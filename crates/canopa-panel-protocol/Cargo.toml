[package]
name = "canopa-panel-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
