[package]
autotests = false
name = "canopa-files"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["desktop", "accessibility-testing"]
# Native AT-SPI acceptance helpers for the lib tests. A dev-dependency would
# pull Iced into the core (--no-default-features) test profile.
accessibility-testing = ["desktop", "canopa-ui/accessibility-testing"]
background-actions = ["dep:tokio", "dep:zbus", "dep:futures-util"]
background-operations = ["dep:tokio", "dep:zbus", "dep:futures-util"]
media-playback = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
local-runtime = ["background-actions", "background-operations", "dep:gio", "dep:glib"]
browser-ui = ["dep:glob", "dep:iced", "dep:canopa-ui", "canopa-ui/accessibility"]
desktop = ["local-runtime", "media-playback", "browser-ui", "canopa-ui/icons", "canopa-ui/accessibility", "dep:clap", "dep:canopa-assets", "dep:resvg", "wayland-clipboard"]
wayland-clipboard = ["dep:wayland-client", "dep:wayland-protocols", "rustix/event", "rustix/pipe", "rustix/net"]

[[bin]]
name = "canopa-files"
path = "src/main.rs"
test = false
required-features = ["desktop"]

[[test]]
name = "device_runtime"
path = "tests/device_runtime.rs"
harness = false
required-features = ["local-runtime"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "network_runtime"
path = "tests/network_runtime.rs"
harness = false
required-features = ["local-runtime"]

[[test]]
name = "file_clipboard_wayland"
path = "tests/file_clipboard_wayland.rs"

[[test]]
name = "local_actions"
path = "tests/local_actions.rs"

[[test]]
name = "local_operation_attention"
path = "tests/local_operation_attention.rs"

[[test]]
name = "uutils_copy"
path = "tests/uutils_copy.rs"

[dependencies]
canopa-i18n.workspace = true
canopa-apps.workspace = true
canopa-file.workspace = true
chrono.workspace = true
image = { workspace = true, features = ["gif", "webp"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
xxhash-rust.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
lzma-rust2.workspace = true
zstd.workspace = true
bzip2.workspace = true
uucore.workspace = true
shlex.workspace = true
thiserror.workspace = true
rustix = { workspace = true, features = ["event", "net"] }
rusqlite.workspace = true
tempfile.workspace = true
futures-channel.workspace = true
futures-util = { workspace = true, optional = true }
url.workspace = true
roxmltree.workspace = true
unicode-segmentation.workspace = true
glob = { version = "0.3.4", optional = true }
gio = { workspace = true, optional = true, features = ["v2_58"] }
glib = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
canopa-config.workspace = true
kdl.workspace = true
canopa-theme.workspace = true
iced = { workspace = true, optional = true, features = ["tiny-skia"] }
canopa-ui = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
canopa-assets = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true

[[example]]
name = "drag_transport"
path = "examples/drag_transport.rs"
required-features = ["desktop"]
