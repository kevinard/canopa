name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev dbus
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: bash scripts/test.sh
