name: Canopa checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [core, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dbus ripgrep pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libpulse-dev libglib2.0-bin pipewire pipewire-bin pipewire-pulse pulseaudio-utils at-spi2-core xdg-desktop-portal python3-gi
      - name: Check core profile
        if: matrix.profile == 'core'
        run: bash scripts/check.sh --core
      - name: Check desktop profile
        if: matrix.profile == 'desktop'
        run: bash scripts/check.sh
