name: Desktop acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canopa-desktop
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: [self-hosted, linux, canopa-desktop]
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Check runner prerequisites
        run: dbus-run-session -- python3 scripts/check-desktop-runner.py
      - name: Verify common protocol
        run: bash scripts/check-panel-protocol.sh
      - name: Build the workspace desktop binaries
        run: cargo build --locked --workspace --bins
      - name: Run the maintained desktop acceptance matrix
        run: python3 scripts/run-desktop-acceptance.py --shell target/debug/canopa-shell --notify target/debug/canopa-notify --output desktop-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-acceptance
          path: desktop-artifacts
