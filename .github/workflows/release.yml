name: Canopa release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libpam0g-dev libpolkit-agent-1-dev fonts-dejavu-core libpulse-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-4-dev libgtk-4-media-gstreamer gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav poppler-utils desktop-file-utils libpipewire-0.3-dev libclang-dev libgnutls28-dev zlib1g-dev binutils
      - run: python3 scripts/test-fork-sources.py
      - run: bash scripts/cargo.sh build --locked --release --workspace --bins --target x86_64-unknown-linux-gnu
      - name: Build private Print client
        run: |
          python3 scripts/fork_sources.py fetch cups --archives target/fork-archives
          python3 scripts/build-cups-authentication.py --archives target/fork-archives --work-dir target/cups-authentication-compat --prepare-only
          python3 scripts/build-cups-authentication.py --archives target/fork-archives --work-dir target/cups-authentication-compat --reuse
      - run: python3 scripts/test-print-runtime-package.py --build-receipt target/cups-authentication-compat/canopa-build.json --binary target/x86_64-unknown-linux-gnu/release/xdg-desktop-portal-canopa
      - run: python3 scripts/build-print-ipp-backend.py --client-build target/cups-authentication-compat/canopa-build.json --work-dir target/print-ipp-backend-compat/maintained
      - run: python3 scripts/test-print-backend-package.py --build-receipt target/print-ipp-backend-compat/maintained/canopa-build.json --client-build target/cups-authentication-compat/canopa-build.json --out target/print-backend-package-check
      - run: bash scripts/package-release.sh target/x86_64-unknown-linux-gnu/release dist --cups-runtime target/cups-authentication-compat/canopa-build.json --cups-ipp-backend target/print-ipp-backend-compat/maintained/canopa-build.json
      - run: bash scripts/smoke-release.sh dist/canopa-x86_64-unknown-linux-gnu.tar.gz --require-print-runtime --require-print-backend
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
