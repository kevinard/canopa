name: Canopa release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libpulse-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-4-dev libgtk-4-media-gstreamer gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav poppler-utils desktop-file-utils
      - run: python3 scripts/check-vendor.py
      - run: cargo build --locked --release --workspace --bins --target x86_64-unknown-linux-gnu
      - run: bash scripts/package-release.sh target/x86_64-unknown-linux-gnu/release dist
      - run: bash scripts/smoke-release.sh dist/canopa-x86_64-unknown-linux-gnu.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
