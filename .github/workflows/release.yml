name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpulse-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --locked --release --bins --target x86_64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/niribar target/x86_64-unknown-linux-gnu/release/niribar-wifi-provider

      - name: Package release
        run: bash scripts/package-release.sh target/x86_64-unknown-linux-gnu/release dist

      - name: Smoke-test extracted release
        run: bash scripts/smoke-release.sh dist/niribar-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
