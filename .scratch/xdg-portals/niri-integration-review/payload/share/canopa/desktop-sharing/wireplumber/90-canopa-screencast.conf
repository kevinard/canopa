# Load before the standard event source, as required for hooks.* components.
wireplumber.components = [
  {
    name = "canopa-screencast.lua", type = script/lua
    provides = hooks.canopa.screencast-access
  }
]
wireplumber.profiles = {
  main = { hooks.canopa.screencast-access = required }
  policy = { hooks.canopa.screencast-access = required }
}
