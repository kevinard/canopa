[package]
name = "niribar"
version = "0.1.0"
edition = "2024"

[dependencies]
iced_layershell = "0.18.0"
iced = { version = "0.14", default-features = false, features = [
  "image",
  "svg",
  "tokio",
  "advanced",
  "wgpu",
  "crisp",
  "web-colors",
  "thread-pool",
  "wayland",
] }
zbus = "5.12.0"
kdl = "6.5.0"
miette = { version = "7.6.0", default-features = false, features = ["fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
niri-ipc = "=26.4.0"
libpulse-binding = "2.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[patch.crates-io]
iced_layershell = { path = "vendor/iced_layershell" }
layershellev = { path = "vendor/layershellev" }
