[workspace]
resolver = "3"
members = [
    "crates/canopa-cli",
    "crates/canopa-file",
    "crates/canopa-config",
    "crates/canopa-theme",
    "crates/canopa-ui",
    "crates/canopa-panel-protocol",
    "notify/crates/canopa-notify",
    "niribar",
]
exclude = [
    "vendor/accesskit_unix",
    "vendor/iced_layershell",
    "vendor/layershellev",
    "niribar/src/modules/focused_window_rotation_prototype",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
canopa-file = { path = "crates/canopa-file" }
canopa-config = { path = "crates/canopa-config" }
canopa-theme = { path = "crates/canopa-theme" }
canopa-ui = { path = "crates/canopa-ui" }
sha2 = "0.10"
canopa-panel-protocol = { path = "crates/canopa-panel-protocol" }
chrono = { version = "0.4", features = ["clock"] }
libpulse-binding = "2.30.1"
miette = { version = "7.6.0", default-features = false, features = ["fancy"] }
niri-ipc = "=26.4.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
accesskit = "0.25.1"
accesskit_unix = { version = "0.24.0", default-features = false, features = ["tokio"] }
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
iced = { version = "0.14", default-features = false, features = ["advanced", "wgpu", "crisp", "web-colors", "thread-pool", "wayland", "image"] }
iced_layershell = { version = "0.19.1", default-features = false }
iced_runtime = "0.14"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
kdl = "6.5.0"
predicates = "3"
roxmltree = "0.20"
rodio = "0.22.2"
rustix = { version = "1.1", features = ["fs", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
url = "2.5"

[patch.crates-io]
accesskit_unix = { path = "vendor/accesskit_unix" }
iced_layershell = { path = "vendor/iced_layershell" }
layershellev = { path = "vendor/layershellev" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
