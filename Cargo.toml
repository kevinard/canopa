[workspace]
resolver = "3"
members = [
    "crates/canopa-panel-protocol",
    "crates/canopa-notify",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/canopa/notify"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "wayland", "image"] }
iced_layershell = { version = "0.18", default-features = false }
kdl = "6.5.0"
predicates = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wayland-client = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }
