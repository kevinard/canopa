[package]
name = "niribar"
version = "0.1.0"
edition = "2024"

[dependencies]
iced_layershell = "0.17.1"
iced = { version = "0.14", features = ["image", "svg", "tokio", "advanced"] }
zbus = "5.12.0"
kdl = "6.5.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
niri-ipc = "25.11.0"
libpulse-binding = "2.30.1"
