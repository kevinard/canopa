[workspace]
resolver = "3"
members = [
  "crates/canopa-apps",
  "crates/canopa-settings",
  "crates/canopa-launcher",
  "crates/canopa-portal",
  "crates/canopa-cli",
  "crates/canopa-session",
  "crates/canopa-session-ui",
  "crates/canopa-greeter",
  "crates/canopa-polkit",
  "crates/canopa-pinentry",
  "crates/canopa-widgets",
  "crates/canopa-assets",
  "crates/canopa-file",
  "crates/canopa-files",
  "crates/canopa-config",
  "crates/canopa-theme",
  "crates/canopa-ui",
  "crates/canopa-i18n",
  "crates/canopa-notify-client",
  "crates/canopa-panel-protocol",
  "crates/canopa-services",
  "crates/canopa-notify",
  "crates/canopa-shell",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
canopa-apps = { path = "crates/canopa-apps" }
canopa-launcher = { path = "crates/canopa-launcher" }
canopa-session-ui = { path = "crates/canopa-session-ui" }
canopa-widgets = { path = "crates/canopa-widgets" }
canopa-assets = { path = "crates/canopa-assets" }
canopa-notify-client = { path = "crates/canopa-notify-client" }
canopa-file = { path = "crates/canopa-file" }
canopa-config = { path = "crates/canopa-config" }
canopa-theme = { path = "crates/canopa-theme" }
canopa-ui = { path = "crates/canopa-ui" }
canopa-i18n = { path = "crates/canopa-i18n" }
sha2 = "0.10"
# Files archives: pure-Rust deflate, xz and bzip2; zstd links its bundled C library.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
zstd = { version = "0.14", default-features = false }
bzip2 = "0.6"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
uucore = { version = "=0.12.0", features = ["buf-copy"] }
reis = "=0.7.1"
shlex = "2"
canopa-panel-protocol = { path = "crates/canopa-panel-protocol" }
canopa-services = { path = "crates/canopa-services" }
chrono = { version = "0.4", features = ["clock"] }
libpulse-binding = "2.30.1"
miette = { version = "7.6.0", default-features = false, features = ["fancy"] }
niri-ipc = "=26.4.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
accesskit = "0.25.1"
accesskit_unix = { version = "0.24.1", default-features = false, features = [
  "tokio",
] }
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
futures-channel = "0.3"
gio = "0.22"
glib = "0.22"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
iced = { version = "0.14", default-features = false, features = [
  "advanced",
  "wgpu",
  "crisp",
  "web-colors",
  "thread-pool",
  "wayland",
  "image",
] }
iced_layershell = { version = "0.19.1", default-features = false }
iced_runtime = "0.14"
iced_renderer = { version = "0.14", default-features = false }
iced_tiny_skia = { version = "0.14", default-features = false, features = ["image", "wayland"] }
tiny-skia = "0.11"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
] }
kdl = "6.5.0"
predicates = "3"
roxmltree = "0.20"
resvg = "0.45.1"
rodio = "0.22.2"
rustix = { version = "1.1", features = ["fs", "process", "rand"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
url = "2.5"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
unicode-segmentation = "1.13"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8.11", features = ["debug-embed"] }
unic-langid = "0.9"

[patch.crates-io]
# Canopa forks: each pins `canopa/main` of github.com/kevinard/<repo>, which is
# the upstream base plus one tracked topic per change (open PRs in each fork).
# Crates from one repository must come from the same commit, or Cargo builds
# two incompatible copies of their shared types. See
# docs/vendor-maintenance.md and docs/fork-inventory.md.
winit = { git = "https://github.com/kevinard/winit", rev = "35125e8b470afafcb2b6d1b0033f154af5e310ca" }
iced = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_core = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_debug = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_devtools = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_futures = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_graphics = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_program = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_renderer = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_runtime = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_tiny_skia = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_wgpu = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_widget = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_winit = { git = "https://github.com/kevinard/iced", rev = "6590c03941200731d06f32ed64c71fb63f344f0f" }
iced_layershell = { git = "https://github.com/kevinard/exwlshelleventloop", rev = "fecb4f1a6462636d7db8ea0da2e26ae1bbe18a18" }
iced_layershell_macros = { git = "https://github.com/kevinard/exwlshelleventloop", rev = "fecb4f1a6462636d7db8ea0da2e26ae1bbe18a18" }
iced_exdevtools = { git = "https://github.com/kevinard/exwlshelleventloop", rev = "fecb4f1a6462636d7db8ea0da2e26ae1bbe18a18" }
layershellev = { git = "https://github.com/kevinard/exwlshelleventloop", rev = "fecb4f1a6462636d7db8ea0da2e26ae1bbe18a18" }
waycrate_xkbkeycode = { git = "https://github.com/kevinard/exwlshelleventloop", rev = "fecb4f1a6462636d7db8ea0da2e26ae1bbe18a18" }
reis = { git = "https://github.com/kevinard/reis", rev = "c99f5a7195977bec7e4cc06861b7b3b447c75625" }
uucore = { git = "https://github.com/kevinard/coreutils", rev = "1e4f136e045306ff99dd7387585f42a336a184b2" }
niri-ipc = { git = "https://github.com/kevinard/niri", rev = "be9d6c1e994bb22c96c835c49ae987da4c19937f" }

# Keep file/line panic backtraces without duplicating full debugger data in
# every integration-test executable. The test profile inherits these settings.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Opt in when inspecting variables/types with a debugger. This uses
# target/debugging/ and leaves the ordinary development cache intact.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Unwind like the tested dev profile. Files, Notify and the portal contain
# worker panics with catch_unwind and report them instead of losing the
# process; abort would skip that recovery only in shipped builds.
panic = "unwind"
