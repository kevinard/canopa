[package]
name = "niribar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
accesskit = "0.25.0"
accesskit_unix = { version = "0.23.0", default-features = false, features = ["tokio"] }
canopa-panel-protocol = { path = "vendor/canopa-panel-protocol" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rustix = { version = "1.1", features = ["fs", "process"] }
iced_layershell = "0.18.0"
iced = { version = "0.14", default-features = false, features = [
  "image",
  "svg",
  "canvas",
  "tokio",
  "advanced",
  "wgpu",
  "crisp",
  "web-colors",
  "thread-pool",
  "wayland",
] }
zbus = "5.12.0"
kdl = "6.5.0"
miette = { version = "7.6.0", default-features = false, features = ["fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
niri-ipc = "=26.4.0"
libpulse-binding = "2.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia"] }
tempfile = "3"

[patch.crates-io]
accesskit_unix = { path = "vendor/accesskit_unix" }
iced_layershell = { path = "vendor/iced_layershell" }
layershellev = { path = "vendor/layershellev" }
