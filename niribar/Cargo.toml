[package]
name = "niribar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
canopa-assets.workspace = true
canopa-notify-client.workspace = true
canopa-config.workspace = true
canopa-theme.workspace = true
canopa-ui.workspace = true
accesskit.workspace = true
accesskit_unix.workspace = true
canopa-panel-protocol.workspace = true
image = { workspace = true, features = ["gif", "webp"] }
rustix.workspace = true
iced_layershell = { workspace = true, features = ["linux-theme-detection"] }
iced = { workspace = true, features = ["svg", "canvas", "tokio"] }
zbus.workspace = true
kdl.workspace = true
miette.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true
chrono.workspace = true
niri-ipc.workspace = true
libpulse-binding.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
iced = { workspace = true, features = ["tiny-skia"] }
tempfile.workspace = true
