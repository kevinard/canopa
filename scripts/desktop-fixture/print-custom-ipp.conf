# Private PDF loopback fixture; integer dimensions/margins are hundredths mm.
ATTR boolean color-supported false
ATTR integer copies-default 1
ATTR rangeOfInteger copies-supported 1-9999
ATTR mimeMediaType document-format-default application/pdf
ATTR mimeMediaType document-format-supported application/pdf
ATTR keyword media-default iso_a4_210x297mm
ATTR keyword media-supported iso_a4_210x297mm,custom_canopa_125x225mm,custom_min_3x5in,custom_max_8.5x14in
ATTR keyword media-ready iso_a4_210x297mm
ATTR keyword media-source-supported auto
ATTR keyword media-type-supported stationery
ATTR collection media-size-supported {
    MEMBER rangeOfInteger x-dimension 7620-21590
    MEMBER rangeOfInteger y-dimension 12700-35560
}
ATTR collection media-col-default {
    MEMBER keyword media-size-name iso_a4_210x297mm
    MEMBER collection media-size {
        MEMBER integer x-dimension 21000
        MEMBER integer y-dimension 29700
    }
    MEMBER integer media-bottom-margin 0
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER integer media-top-margin 0
}
ATTR collection media-col-ready {
    MEMBER keyword media-size-name iso_a4_210x297mm
    MEMBER collection media-size {
        MEMBER integer x-dimension 21000
        MEMBER integer y-dimension 29700
    }
    MEMBER integer media-bottom-margin 0
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER integer media-top-margin 0
}
ATTR collection media-col-database {
    MEMBER keyword media-size-name iso_a4_210x297mm
    MEMBER collection media-size {
        MEMBER integer x-dimension 21000
        MEMBER integer y-dimension 29700
    }
    MEMBER integer media-bottom-margin 0
    MEMBER integer media-left-margin 0
    MEMBER integer media-right-margin 0
    MEMBER integer media-top-margin 0
}, {
    MEMBER keyword media-size-name custom_canopa_125x225mm
    MEMBER collection media-size {
        MEMBER integer x-dimension 12500
        MEMBER integer y-dimension 22500
    }
    MEMBER integer media-bottom-margin 1270
    MEMBER integer media-left-margin 318
    MEMBER integer media-right-margin 318
    MEMBER integer media-top-margin 318
}
ATTR rangeOfInteger media-bottom-margin-supported 0-1270
ATTR rangeOfInteger media-left-margin-supported 0-1270
ATTR rangeOfInteger media-right-margin-supported 0-1270
ATTR rangeOfInteger media-top-margin-supported 0-1270
ATTR enum orientation-requested-default 3
ATTR enum orientation-requested-supported 3,4,5,6
ATTR keyword output-bin-default face-down
ATTR keyword output-bin-supported face-down
ATTR keyword print-color-mode-default monochrome
ATTR keyword print-color-mode-supported monochrome
ATTR enum print-quality-default 4
ATTR enum print-quality-supported 3,4,5
ATTR resolution printer-resolution-default 300dpi
ATTR resolution printer-resolution-supported 300dpi
ATTR text printer-make-and-model "Canopa custom PDF fixture"
ATTR integer pages-per-minute 1
ATTR keyword sides-default one-sided
ATTR keyword sides-supported one-sided,two-sided-long-edge,two-sided-short-edge
