[workspace]
resolver = "3"
members = [
    "crates/canopa-panel-protocol",
    "crates/canopa-notify",
]
exclude = [
    "vendor/accesskit_unix",
    "vendor/iced_layershell",
    "vendor/layershellev",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
accesskit = "0.25.0"
accesskit_unix = { version = "0.23.0", default-features = false, features = ["tokio"] }
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
iced = { version = "0.14", default-features = false, features = ["advanced", "wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "wayland", "image"] }
iced_layershell = { version = "0.18", default-features = false }
iced_runtime = "0.14"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
kdl = "6.5.0"
predicates = "3"
roxmltree = "0.20"
rodio = "0.22.2"
rustix = { version = "1.1", features = ["fs", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
url = "2.5"

[patch.crates-io]
accesskit_unix = { path = "vendor/accesskit_unix" }
iced_layershell = { path = "vendor/iced_layershell" }
layershellev = { path = "vendor/layershellev" }
