name: Desktop acceptance
on:
  workflow_dispatch:
    inputs:
      niribar_root:
        description: Compatible Niribar checkout on the dedicated runner
        required: true
        default: /opt/canopa/niribar
permissions:
  contents: read
concurrency:
  group: canopa-desktop
  cancel-in-progress: false
jobs:
  desktop:
    # Dedicated Linux runner with Niri, Sway, software Mesa, AT-SPI, Python GI,
    # grim, C compiler, pkg-config and the normal desktop build dependencies.
    runs-on: [self-hosted, linux, canopa-desktop]
    timeout-minutes: 45
    env:
      NIRIBAR_ROOT: ${{ inputs.niribar_root }}
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install the verified Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check runner prerequisites
        run: python3 scripts/check-desktop-runner.py --niribar-root "$NIRIBAR_ROOT"
      - name: Verify compatible generic protocol
        run: bash scripts/check-panel-protocol.sh "$NIRIBAR_ROOT"
      - name: Build both desktop adapters
        run: |
          cargo build --locked -p canopa-notify
          cargo build --locked --manifest-path "$NIRIBAR_ROOT/Cargo.toml"
      - name: Exercise actual compositor, native actions and Center
        run: python3 scripts/test-desktop.py --notify target/debug/canopa-notify --niribar target/debug/niribar --artifacts desktop-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-acceptance
          path: desktop-artifacts
